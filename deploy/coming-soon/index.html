<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Ventilators.ca — Our website is coming soon. Notre site web arrive bientôt."
    />
    <title>Coming soon · Bientôt disponible | Ventilators.ca</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        color: #082448;
        background: #f3f7fb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }
      main {
        width: min(100%, 760px);
        padding: clamp(32px, 7vw, 72px);
        background: #fff;
        border: 1px solid #dce5ef;
        border-radius: 20px;
        box-shadow: 0 20px 70px #0824480d;
      }
      img {
        display: block;
        width: min(260px, 100%);
        height: auto;
        margin-bottom: 56px;
      }
      .accent {
        width: 48px;
        height: 4px;
        border-radius: 2px;
        background: #1267de;
        margin-bottom: 24px;
      }
      h1,
      h2 {
        letter-spacing: -0.04em;
        line-height: 1.1;
        margin: 0 0 16px;
      }
      h1 {
        font-size: clamp(36px, 6vw, 56px);
      }
      h2 {
        font-size: clamp(26px, 4vw, 36px);
      }
      p {
        color: #4b6076;
        font-size: 18px;
        line-height: 1.65;
        margin: 0;
        max-width: 34em;
      }
      section {
        margin-top: 36px;
        padding-top: 32px;
        border-top: 1px solid #dce5ef;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="Ventilators.ca" width="260" height="83" />
      <div class="accent" aria-hidden="true"></div>
      <h1>Coming soon.</h1>
      <p>Our new website is taking shape. Please check back soon.</p>
      <section lang="fr" aria-labelledby="fr-heading">
        <h2 id="fr-heading">Bientôt disponible.</h2>
        <p>Notre nouveau site web prend forme. Revenez nous voir bientôt.</p>
      </section>
    </main>
  </body>
</html>
